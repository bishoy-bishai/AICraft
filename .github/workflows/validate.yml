name: Validate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run strict validation
        run: python validation/validate.py --strict

      - name: Run deterministic tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Validate Claude plugin (if CLI available)
        shell: bash
        run: |
          if command -v claude >/dev/null 2>&1; then
            claude plugin validate . --strict
          else
            echo "claude CLI not available; skipping plugin CLI validation"
          fi
